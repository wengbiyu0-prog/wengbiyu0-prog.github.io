<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>摄影漫步 | 翁碧妤</title>
    <link rel="stylesheet" href="./styles.css?v=20260514-album" />
    <script src="./script.js?v=20260514-album" defer></script>
  </head>
  <body class="subpage photography-page">
    <a class="skip-link" href="#album">跳到相册</a>
    <div class="film-grain" aria-hidden="true"></div>
    <header class="subpage-topbar">
      <a href="./index.html#focus">← Back</a>
      <span>Photography Walk / 2026</span>
      <strong>摄影漫步</strong>
    </header>

    <main id="album" class="album-shell" data-flipbook>
      <aside class="album-thumb-rail" aria-label="照片序列">
        <button class="is-active" type="button" data-book-thumb data-src="./pic/photo-01.jpeg"><img src="./pic/photo-01.jpeg" alt="照片 1" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-02.jpeg"><img src="./pic/photo-02.jpeg" alt="照片 2" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-03.jpeg"><img src="./pic/photo-03.jpeg" alt="照片 3" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-04.jpeg"><img src="./pic/photo-04.jpeg" alt="照片 4" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-05.jpeg"><img src="./pic/photo-05.jpeg" alt="照片 5" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-06.jpeg"><img src="./pic/photo-06.jpeg" alt="照片 6" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-07.jpeg"><img src="./pic/photo-07.jpeg" alt="照片 7" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-08.jpeg"><img src="./pic/photo-08.jpeg" alt="照片 8" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-09.jpeg"><img src="./pic/photo-09.jpeg" alt="照片 9" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-10.jpeg"><img src="./pic/photo-10.jpeg" alt="照片 10" /></button>
        <button type="button" data-book-thumb data-src="./pic/photo-11.jpeg"><img src="./pic/photo-11.jpeg" alt="照片 11" /></button>
      </aside>

      <section class="flipbook" aria-label="可翻页相册">
        <button class="page-hit page-hit-left" type="button" data-book-prev aria-label="上一页"></button>
        <div class="book-spread">
          <figure class="book-page book-page-left">
            <img data-book-prev-image src="./pic/photo-11.jpeg" alt="上一张照片" />
            <figcaption>Previous frame</figcaption>
          </figure>
          <figure class="book-page book-page-right">
            <img data-book-image src="./pic/photo-01.jpeg" alt="当前照片" />
            <figcaption>
              <span data-book-count>01 / 11</span>
              <strong>Field Notes</strong>
            </figcaption>
          </figure>
        </div>
        <button class="page-hit page-hit-right" type="button" data-book-next aria-label="下一页"></button>
      </section>
    </main>
  </body>
</html>
