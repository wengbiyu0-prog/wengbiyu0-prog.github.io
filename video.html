<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020305" />
    <title>影像长廊 | 翁碧妤</title>
    <link rel="stylesheet" href="./styles.css?v=20260514-media" />
    <script src="./script.js?v=20260514-media" defer></script>
  </head>
  <body class="subpage video-page">
    <a class="skip-link" href="#video-room">跳到影像空间</a>
    <div class="film-grain" aria-hidden="true"></div>
    <header class="subpage-topbar video-topbar">
      <a href="./index.html#focus">← Back</a>
      <span>Cinema Scope / 2026</span>
      <strong>影像长廊</strong>
    </header>

    <main id="video-room" class="cinema-room" data-video-room>
      <section class="vision-stage" aria-label="电影视镜空间">
        <button class="vision-side vision-left" type="button" data-video-prev aria-label="上一个视频">
          <video data-video-left muted loop playsinline autoplay preload="metadata" src="./mov/video-03.mp4"></video>
          <span>Left</span>
        </button>

        <figure class="vision-center">
          <video data-video-main controls playsinline preload="metadata" src="./mov/video-01.mp4"></video>
          <figcaption>
            <span data-video-count>01 / 03</span>
            <strong data-video-title>Screening 01</strong>
            <em>Video glows as the only lamp in the room.</em>
          </figcaption>
        </figure>

        <button class="vision-side vision-right" type="button" data-video-next aria-label="下一个视频">
          <video data-video-right muted loop playsinline autoplay preload="metadata" src="./mov/video-02.mp4"></video>
          <span>Right</span>
        </button>
      </section>
    </main>
  </body>
</html>
