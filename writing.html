<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080706" />
    <title>文字创作 | 翁碧妤</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-integrated-scene" />
    <script src="./media-library.js?v=20261021-integrated-scene" defer></script>
    <script src="./script.js?v=20261021-integrated-scene" defer></script>
  </head>
  <body class="subpage writing-room-page">
    <a class="skip-link" href="#writing-room">跳到书房</a>
    <header class="subpage-topbar room-topbar">
      <a href="./index.html#projects">← SELECTED WORK</a>
      <span>WRITING ROOM / 03</span>
      <strong>文字创作</strong>
    </header>

    <main id="writing-room" class="writing-room-scene" data-writing-room>
      <div class="writing-heading">
        <h1>案头作品</h1>
        <p>选一本书，慢慢读。</p>
      </div>
      <div class="writing-desk">
        <a class="crystal-portal" href="https://edimage-world.onrender.com/" target="_blank" rel="noopener noreferrer" aria-label="你想进入另一个空间吗？">
          <span class="crystal-sparkles" data-crystal-sparkles aria-hidden="true"></span>
          <span class="crystal-prompt" data-crystal-prompt aria-hidden="true"></span>
        </a>
        <button class="book-hotspot fiction-book" type="button" data-read-category="fiction" id="fiction" aria-label="打开虚构写作"></button>
        <button class="book-hotspot screenplay-book" type="button" data-read-category="screenplay" id="screenplay" aria-label="打开剧本"></button>
        <svg class="book-inscriptions" viewBox="0 0 1586 992" aria-hidden="true">
          <defs>
            <linearGradient id="cover-foil" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0" stop-color="#ead49a" />
              <stop offset="0.48" stop-color="#a9854e" />
              <stop offset="1" stop-color="#d1b578" />
            </linearGradient>
          </defs>
          <g class="cover-title" transform="matrix(1,-.055,.44,.24,710,604)">
            <text x="2" y="2" class="cover-title-shadow">文字作品</text>
            <text x="0" y="0">文字作品</text>
          </g>
          <g class="cover-title screenplay-title" transform="matrix(1,-.045,.38,.22,1065,553)">
            <text x="2" y="2" class="cover-title-shadow">剧本创作</text>
            <text x="0" y="0">剧本创作</text>
          </g>
        </svg>
      </div>
      <div class="room-footer"><span>FICTION / SCREENPLAY</span><span>READING ROOM</span></div>

      <dialog class="reader-dialog" data-reader-dialog aria-labelledby="reader-title">
        <div class="reader-topline"><span data-reader-category>WRITING ARCHIVE</span><button type="button" data-reader-close aria-label="合上书本">×</button></div>
        <div class="reader-spread">
          <div class="reader-page reader-page-left"><span>WENG BIYU</span><i>NOTES<br />& STORIES</i></div>
          <article class="reader-page reader-page-right">
            <span data-reader-page>01 / 01</span>
            <h1 id="reader-title" data-reader-title></h1>
            <p data-reader-content></p>
            <small data-reader-empty>作品正文待补充</small>
          </article>
        </div>
        <div class="reader-controls"><button type="button" data-reader-prev aria-label="上一页">←</button><span data-reader-count>01 / 01</span><button type="button" data-reader-next aria-label="下一页">→</button></div>
      </dialog>
    </main>
  </body>
</html>
